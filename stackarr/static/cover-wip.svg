<svg xmlns="http://www.w3.org/2000/svg" width="301" height="301" viewBox="0 0 300 300" role="img" aria-label="Fetching cover">
  <!-- Stackarr's "cover on its way" placeholder: shown while the background
       worker fetches the real art; the page swaps the real cover in.
       width/height 301 is the marker app.js recognises it by (an <img>
       can't see the redirect that served it). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect x="14" y="14" width="272" height="272" rx="18" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 9"/>
  <!-- the Stackarr stack -->
  <g transform="translate(86 72) scale(2)">
    <rect x="12" y="42" width="40" height="9" rx="2.5" fill="#d98c3f"/>
    <rect x="15" y="31" width="38" height="9" rx="2.5" fill="#e0a96d"/>
    <rect x="11" y="20" width="36" height="9" rx="2.5" fill="#f0b27a" opacity="0.55">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="38" y="20" width="4" height="13" fill="#5eead4"/>
  </g>
  <text x="150" y="238" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#94a3b8">Fetching cover…</text>
  <text x="150" y="262" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#64748b">it'll appear in a moment</text>
</svg>
